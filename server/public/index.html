<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Dashboard de monitoramento do rack — vigilante, RFID, sensores e alarmes.">
  <title>Rack Monitor</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>
  <div class="container">

    <!-- ═══════════ HEADER ═══════════ -->
    <header class="header">
      <h1 class="header__title">
        <span class="header__badge">RACK</span>
        Rack Monitor
      </h1>

      <div class="header__connection" id="connection" role="status" aria-live="polite">
        <span class="dot dot--offline" id="connectionDot"></span>
        <span id="connectionText">Conectando…</span>
      </div>
    </header>

    <!-- ═══════════ CARDS DE STATUS ═══════════ -->
    <main>
      <section class="cards" aria-label="Status atual">
        <article class="card" data-tone="modo">
          <h2 class="card__label">Modo Vigilante</h2>
          <p class="card__value" id="cardModo">--</p>
        </article>

        <article class="card" data-tone="estado">
          <h2 class="card__label">Estado Alarme</h2>
          <p class="card__value" id="cardEstado">--</p>
        </article>

        <article class="card" data-tone="porta">
          <h2 class="card__label">Porta</h2>
          <p class="card__value" id="cardPorta">--</p>
        </article>

        <article class="card">
          <h2 class="card__label">IP do ESP32</h2>
          <p class="card__value card__value--sm" id="cardIP">--</p>
        </article>

        <article class="card">
          <h2 class="card__label">Último UID</h2>
          <p class="card__value card__value--mono" id="cardUID">--</p>
        </article>

        <article class="card">
          <h2 class="card__label">Acessos RFID</h2>
          <p class="card__value" id="cardAcessos">0</p>
        </article>

        <article class="card">
          <h2 class="card__label">Invasões</h2>
          <p class="card__value" id="cardInvasoes">0</p>
        </article>

        <article class="card">
          <h2 class="card__label">Rearmes Bloqueados</h2>
          <p class="card__value" id="cardBloqueios">0</p>
        </article>
      </section>

      <!-- ═══════════ CONTROLES ═══════════ -->
      <section class="controls" aria-label="Comandos">
        <button type="button" class="btn btn--primary" data-command="ARMAR">
          <span aria-hidden="true">🔒</span> Armar
        </button>
        <button type="button" class="btn btn--danger" data-command="DESARMAR" data-confirm="Desarmar o sistema?">
          <span aria-hidden="true">🔓</span> Desarmar
        </button>
        <button type="button" class="btn btn--neutral" data-command="TESTE">
          <span aria-hidden="true">🧪</span> Modo Teste
        </button>
        <button type="button" class="btn btn--neutral" data-command="RESET" data-confirm="Zerar contadores?">
          <span aria-hidden="true">🔄</span> Reset
        </button>
      </section>

      <!-- ═══════════ EVENTOS SEMÂNTICOS ═══════════ -->
      <section class="panel">
        <h2 class="panel__title">Últimos eventos</h2>
        <div class="log log--events" id="logEventos" aria-live="polite">
          <p class="log__empty">Aguardando eventos…</p>
        </div>
      </section>

      <!-- ═══════════ HISTÓRICO DE STATUS ═══════════ -->
      <section class="panel">
        <h2 class="panel__title">Histórico de status</h2>
        <div class="log log--history" id="logHistorico" aria-live="polite">
          <p class="log__empty">Aguardando dados do ESP32…</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      Rack Monitor v2.0 · Docker · <span id="footerTime">--</span>
    </footer>
  </div>
</body>

</html>
